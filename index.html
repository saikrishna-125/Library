<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="addBook">
        <button
          commandfor="book-dialog"
          command="show-modal"
          class="dialog-button"
        >
          Add Book
        </button>
      </div>
      <div class="library"></div>
    </div>

    <dialog id="book-dialog">
      <div class="dialog-container">
        <button class="close" aria-label="close">x</button>
        <form method="dialog" action="">
          <div class="form-title">Add Book</div>
          <div class="form-container">
            <div class="input-element">
              <label for="title">Title*:</label>
              <input type="text" id="title" name="title" required />
            </div>
            <div class="input-element">
              <label for="author">Author*:</label>
              <input type="text" id="author" required name="author" />
            </div>
            <div class="input-element">
              <label for="pages">Book Length*:</label>
              <input
                type="number"
                id="pages"
                required
                name="pages"
                min="1"
                step="1"
              />
            </div>
            <fieldset>
              <legend>Read?*</legend>
              <div class="radio-element">
                <div class="radio-field">
                  <input
                    type="radio"
                    id="completed"
                    name="read"
                    value="completed"
                  />
                  <label for="completed">Completed</label>
                </div>
                <div class="radio-field">
                  <input
                    type="radio"
                    id="not-completed"
                    name="read"
                    value="not-completed"
                    required
                  />
                  <label for="not-completed">Not Completed</label>
                </div>
              </div>
            </fieldset>
            <button type="submit" class="book-submit">Submit</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="edit-dialog">
      <div class="dialog-container">
        <button
          class="close"
          commandfor="edit-dialog"
          command="close"
          aria-label="close"
        >
          x
        </button>
        <div class="form-title">Edit Status</div>
        <form method="dialog" action="">
          <div class="edit-form-container">
            <label for="select-status">Select Read Status</label>
            <select id="select-status" name="read-status">
              <option value="completed">Completed</option>
              <option value="not-completed">Not Completed</option>
            </select>
            <button class="edit-submit">Submit</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
